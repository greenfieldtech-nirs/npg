name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend tests (MariaDB, MongoDB, Redis in containers)
        run: ./scripts/dev-test.sh
      - name: Test summary
        if: always()
        run: ./scripts/test-summary.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint, typecheck and build (in a Node container)
        run: ./scripts/frontend-check.sh

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Production compose renders with example configuration
        run: docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.production.example config -q
      - name: Production compose refuses to render without secrets
        run: "! docker compose -f docker/docker-compose.prod.yml config -q"
      - name: Build production images
        run: |
          docker build -f backend/Dockerfile -t npg-backend:ci .
          docker build -t npg-frontend:ci frontend

  stack:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Start dev stack
        run: docker compose -f docker/docker-compose.dev.yml up --build -d
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:19090/health/ready > /dev/null; then exit 0; fi
            sleep 2
          done
          docker compose -f docker/docker-compose.dev.yml logs backend
          exit 1
      - name: Smoke checks
        run: |
          curl -sf http://localhost:18080/health/live
          curl -sf http://localhost:19090/metrics | grep -q npg_
          # the management API requires a token
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/api/operators)" = "401"
          ./scripts/replay-trace.sh
      - name: Stop dev stack
        if: always()
        run: docker compose -f docker/docker-compose.dev.yml down
