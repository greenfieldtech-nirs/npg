# Production edge proxy. TLS terminates here; certificates are mounted from docker/tls/:
#   cert.pem / key.pem  - this gateway's server certificate
#   peer-ca.pem         - CA bundle that issued the peer operators' client certificates
#
# /np (operator traffic) asks peers for a client certificate. Its verified identity is passed
# to the backend in X-SSL-Client-Verify / X-SSL-Client-S-DN, which this proxy always overwrites;
# the backend trusts them only with INBOUND_TRUST_PROXY_CLIENT_CERT=true. Peers without a
# certificate can still be authenticated by source IP (ip_allowlist on their endpoint).

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=np:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

upstream api_backend      { server api:8080; }
upstream inbound_backend  { server inbound-gateway:8081; }
upstream frontend_app     { server frontend:8080; }

server_tokens off;

# Plain HTTP only redirects (and answers the load-balancer liveness probe).
server {
    listen 80;
    server_name _;

    location = /health/live { proxy_pass http://api_backend; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate         /etc/nginx/tls/cert.pem;
    ssl_certificate_key     /etc/nginx/tls/key.pem;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache       shared:SSL:10m;
    ssl_client_certificate  /etc/nginx/tls/peer-ca.pem;
    ssl_verify_client       optional;
    ssl_verify_depth        3;

    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    location = /health/live { proxy_pass http://api_backend; }

    # metrics and readiness are internal (HEALTH_PORT on each container); never public
    location ~ ^/(metrics|health/ready) { return 404; }

    location /np {
        limit_req zone=np burst=100 nodelay;
        proxy_pass http://inbound_backend;
        proxy_set_header X-Real-IP $remote_addr;
        # client-certificate identity is always set by this proxy, never passed through from the client
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-S-DN $ssl_client_s_dn;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-SSL-Client-Verify "";
        proxy_set_header X-SSL-Client-S-DN "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-SSL-Client-Verify "";
        proxy_set_header X-SSL-Client-S-DN "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://frontend_app;
    }
}
