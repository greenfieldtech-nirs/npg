# Production edge proxy, behind the load balancer.
#
# The load balancer terminates TLS and forwards plain HTTP to port 8090 only: the console, the
# management API (/api), the operators' inbound gateway (/np) and the LB health check
# (/health/live) are all served here.
#
# Client addresses: the real client IP comes from the load balancer's X-Forwarded-For, trusted only
# from LB_TRUSTED_CIDRS (written to conf.d/00-real-ip.conf at start by 40-npg-real-ip.sh). Rate
# limits use it, and it is passed to the backend as X-Real-IP (peer IP allowlists, login throttling).
#
# Peer client certificates: TLS ends at the load balancer, so NGINX cannot verify them. The
# X-SSL-Client-* headers are always blanked here; keep INBOUND_TRUST_PROXY_CLIENT_CERT=false and
# authenticate peers by IP allowlist (operator endpoint ip_allowlist).

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=np:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

upstream api_backend      { server api:8080; }
upstream inbound_backend  { server inbound-gateway:8081; }
upstream frontend_app     { server frontend:8080; }

server_tokens off;

server {
    listen 8090;
    server_name _;

    client_max_body_size 1m;

    # sent over HTTP to the load balancer, which serves it to browsers over HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # load-balancer health check
    location = /health/live { proxy_pass http://api_backend; }

    # metrics and readiness are internal (HEALTH_PORT on each container); never public
    location ~ ^/(metrics|health/ready) { return 404; }

    location /np {
        limit_req zone=np burst=100 nodelay;
        proxy_pass http://inbound_backend;
        proxy_set_header X-Real-IP $remote_addr;
        # never pass a client-supplied certificate identity through
        proxy_set_header X-SSL-Client-Verify "";
        proxy_set_header X-SSL-Client-S-DN "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-SSL-Client-Verify "";
        proxy_set_header X-SSL-Client-S-DN "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-SSL-Client-Verify "";
        proxy_set_header X-SSL-Client-S-DN "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://frontend_app;
    }
}
