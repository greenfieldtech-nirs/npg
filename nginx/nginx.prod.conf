# Production NGINX config. TLS termination at 443; upstreams point at the
# split-role backend services (api / inbound-gateway), not the dev "backend".
# Supply cert.pem/key.pem via docker/tls/ before enabling the 443 server.

upstream api_backend {
    server api:8080;
}

upstream inbound_backend {
    server inbound-gateway:8080;
}

upstream frontend_app {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    location /health {
        proxy_pass http://api_backend;
    }

    location /metrics {
        proxy_pass http://api_backend;
    }

    location /np {
        proxy_pass http://inbound_backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api {
        proxy_pass http://api_backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://frontend_app;
    }
}

