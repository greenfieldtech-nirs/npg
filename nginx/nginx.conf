server {
    listen 80;
    server_name localhost;

    client_max_body_size 1m;

    # ponytail: re-resolve upstreams every 5s so recreated containers (new IPs)
    # don't leave nginx with stale addresses. 127.0.0.11 = docker embedded DNS,
    # 10.89.6.1 = podman dnsmasq; nginx tries them in order.
    resolver 127.0.0.11 10.89.6.1 valid=5s ipv6=off;

    set $api_backend http://backend:8080;
    set $inbound_backend http://backend:8081;
    set $frontend_app http://frontend:8080;

    location = /health/live {
        proxy_pass $api_backend;
    }

    location /np {
        proxy_pass $inbound_backend;
        proxy_set_header X-Real-IP $remote_addr;
        # client-certificate identity is always set by this proxy, never passed through from the client
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-S-DN $ssl_client_s_dn;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api {
        proxy_pass $api_backend;
        proxy_set_header X-Real-IP $remote_addr;
        # client-certificate identity is always set by this proxy, never passed through from the client
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-S-DN $ssl_client_s_dn;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass $frontend_app;
    }
}
